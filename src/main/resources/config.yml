# =========================================================
#   ✿ BlossomTeleport ✿  -  made for Blossom SMP
#   Change anything here, then type:  /blossomtp reload
#   Colours: &a &b &c ... and hex like &#FF69B4
#   Sounds use Minecraft names like: entity.enderman.teleport
# =========================================================

# ---------- Teleporting (used by everything below) ----------
teleport:
  # Seconds you have to stand still before teleporting. 0 = instant.
  warmup: 3
  # Cancel the teleport if you move or get hit while waiting
  cancel-on-move: true
  cancel-on-damage: true
  # Stop players in combat (BlossomCombat) from teleporting
  block-in-combat: true
  sound: "entity.enderman.teleport"
  particles: true
  # Show a big title on screen after teleporting
  title: true

# ---------- /tpa  /tpahere ----------
tpa:
  enabled: true
  # Seconds before a request runs out
  timeout: 60
  # Seconds a player must wait between sending requests
  cooldown: 10
  # Sound the other player hears when they get a request
  request-sound: "block.note_block.pling"

# ---------- /rtp ----------
rtp:
  enabled: true
  # Seconds between uses (300 = 5 minutes)
  cooldown: 300
  # Players land somewhere between these distances from the center
  min-distance: 300
  max-distance: 3000
  center-x: 0
  center-z: 0
  # How many random spots to try before giving up
  max-tries: 15
  # Worlds where /rtp is NOT allowed
  blocked-worlds:
    - world_the_end
  # Never land on these
  unsafe-blocks:
    - LAVA
    - WATER
    - MAGMA_BLOCK
    - CACTUS
    - FIRE
    - SOUL_FIRE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - POWDER_SNOW
    - SWEET_BERRY_BUSH
    - POINTED_DRIPSTONE
    - KELP
    - SEAGRASS
    - BUBBLE_COLUMN

# ---------- /home  /sethome  /delhome  /homes ----------
homes:
  enabled: true
  # Seconds between /home uses
  cooldown: 5
  # How many homes normal players get
  default-limit: 3
  # Give more homes with a permission:  blossomteleport.homes.<name>
  # Example:  lp group admin permission set blossomteleport.homes.staff true
  # You can also use numbers:  blossomteleport.homes.10  =  10 homes
  limits:
    staff: 10
  # Worlds where players can't set homes
  blocked-worlds: []
  menu:
    title: "&#FF69B4✿ &lYour Homes"
    home-item: RED_BED
    empty-item: GRAY_STAINED_GLASS_PANE
    home-name: "&#FFB6C1&l{home}"
    home-lore:
      - "&7World: &f{world}"
      - "&7Location: &f{x}, {y}, {z}"
      - ""
      - "&a▶ Left-click &7to teleport"
      - "&c✖ Shift + Right-click &7to delete"
    empty-name: "&7Empty home slot"
    empty-lore:
      - "&7Type &f/sethome <name>"
      - "&7to save a home here."

# ---------- /spawn  /setspawn ----------
spawn:
  enabled: true
  cooldown: 0
  # Send brand new players to spawn the first time they join
  teleport-on-first-join: true
  # Send players to spawn every time they join
  teleport-on-join: false
  # Respawn at spawn when you die (if you have no bed or anchor)
  teleport-on-respawn: true

# ---------- /back ----------
back:
  enabled: true
  cooldown: 30
  # Let /back take you to where you died
  on-death: true

